name: Family Care AI CI/CD Build Pipeline
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Fix Android V2 Embedding & Manifest
        run: |
          # Agar android folder nahi hai ya v1 hai, toh yeh use v2 ke sath fresh bana dega
          rm -rf android
          flutter create . --platforms=android --org com.familycare.ai
          
          # Manifest file mein turant internet aur camera permission inject kar dega
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <application/' "$MANIFEST_PATH"
            echo "Permissions injected successfully into AndroidManifest.xml!"
          fi

      - name: Build APK
        run: flutter build apk --release
        env:
          ORG_GRADLE_PROJECT_jvmargs: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK Artifact
        uses: upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
